name: TittiesNative
options:
  bundleIdPrefix: com.titties
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  TittiesNative:
    type: application
    platform: iOS
    sources:
      - path: TittiesNative
        excludes:
          - Info.plist
          - Resources
    resources:
      - path: TittiesNative/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.titties.nativeapp
        INFOPLIST_FILE: TittiesNative/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
